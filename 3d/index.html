<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoolmi Office · 3D 한옥 둘러보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b1420;font-family:"Noto Sans KR",system-ui,sans-serif}#host{position:absolute;inset:0}</style>
</head>
<body>
<div id="host"></div>
<script src="../o3d/three.min.js"></script>
<script src="../o3d/hanok3d.js?v=7"></script>
<script>
(function () {
  var Q = new URLSearchParams(location.search), n = function (k) { return Q.get(k) == null ? undefined : +Q.get(k); };
  var o = { capture: Q.get('cap') || false, es: Q.get('es') === '1', fp: Q.get('fp') === '1', view: Q.get('view') || undefined, light: Q.get('light') === '1', yaw: n('yaw'), pitch: n('pitch'), dist: n('dist'), name: '나',
    look: { tc: '#F7C9C9', hc: '#A0674A', item: 'book', hair: 'soft', face: 'grin' } };
  if (Q.get('tod')) o.night = Q.get('tod') === 'night';
  if (Q.get('px')) o.start = { x: n('px'), z: n('pz'), dir: n('dir') == null ? Math.PI : n('dir') };
  var eng = Hanok3D.create(document.getElementById('host'), o);
  if (!eng) { document.body.innerHTML = '<p style="color:#fff;padding:24px">이 브라우저에서는 3D를 열 수 없어요.</p>'; return; }
  eng.setPeople([
    { id: 'a', name: '마케터 1', look: { tc: '#F6D79A', hc: '#5A3426', item: 'phone', hair: 'curly', face: 'happy' }, x: 3.6, z: 6.2, dir: 1.6 },
    { id: 'b', name: '선생님 1', look: { tc: '#C9E8C2', hc: '#3B3236', item: 'book', hair: 'long', face: 'smile', acc: 'glasses' }, x: 26, z: 4.2, dir: 0 },
    { id: 'c', name: '개발자 1', look: { tc: '#BFD9F2', hc: '#3B3236', item: 'laptop', hair: 'spiky', face: 'wink', acc: 'phones' }, x: 10.8, z: 21.4, dir: 2 },
    { id: 'd', name: '마케터 2', look: { tc: '#DCD0F2', hc: '#C98E9A', item: 'mug', hair: 'straight', face: 'wow', acc: 'ribbon' }, x: 16.4, z: 13.9, dir: -2.2 }
  ]);
  eng.setSeats({ mk: ['다니엘라', '카밀라'], tc: ['소피아'], dev: ['개발자 1'], op: ['율미'] });
  eng.setBoard({ stages: [['문의', 4], ['상담 예약', 2], ['상담 완료', 3], ['결제 대기', 1], ['수강 중', 6], ['보류·이탈', 1]], pend: 1, late: 0 });
  eng.focus(); window.eng = eng;
})();
</script>
</body>
</html>
