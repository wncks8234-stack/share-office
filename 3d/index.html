<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoolmi Office · 3D 시안</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1420;font-family:"Noto Sans KR",system-ui,sans-serif;color:#4A3A32}
canvas#c{display:block;width:100%;height:100%;outline:none}
.ui{position:absolute;z-index:5}
.chip{background:rgba(255,251,243,.94);border:1.6px solid #8A766B;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
#top{left:16px;top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#title{font-size:15px;font-weight:600}
#btns{right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:13px;font-weight:500;min-height:44px;padding:0 16px;border-radius:999px;border:1.6px solid #8A766B;background:#FFFBF3;color:#4A3A32;cursor:pointer}
button[aria-pressed="true"]{background:#F5C542}
#hint{left:16px;bottom:16px;max-width:520px;line-height:1.5}
#near{left:50%;bottom:84px;transform:translateX(-50%);display:none;font-size:14px}
#toast{left:50%;top:70px;transform:translateX(-50%);display:none}
#mini{right:16px;top:14px;width:176px;height:128px;border-radius:14px;border:1.6px solid #8A766B;background:#FFFBF3}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D 오피스. 방향키나 WASD로 걸어요"></canvas>
<div id="top" class="ui"><span id="title" class="chip">Yoolmi Office · 3D 시안</span><span id="clock" class="chip"></span><span id="room" class="chip"></span></div>
<canvas id="mini" class="ui" width="352" height="256" aria-hidden="true"></canvas>
<div id="near" class="ui chip" role="status"></div>
<div id="toast" class="ui chip" role="status"></div>
<div id="hint" class="ui chip">WASD·방향키: 걷기 &nbsp;·&nbsp; 마우스 드래그 / Q·E: 둘러보기 &nbsp;·&nbsp; 휠: 확대 &nbsp;·&nbsp; Enter: 물건 열기 &nbsp;·&nbsp; V: 1인칭</div>
<div id="btns" class="ui">
  <button id="bView" type="button" aria-pressed="false">1인칭으로 보기</button>
  <button id="bTod" type="button">낮·밤 바꾸기</button>
</div>
<script src="three.min.js"></script>
<script src="office3d.js"></script>
</body>
</html>
